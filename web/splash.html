<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' tauri: http://tauri.localhost; font-src 'self' tauri: http://tauri.localhost" />
<title>PokéBonk</title>
<!--
  The client's loading screen (docs/DESKTOP.md, «Pantalla de carga»): over the game while pokebonk.com loads, from the
  first frame to the main menu. src-tauri/src/splash.rs opens it with ?lang, img, tips (JSON), tip, label and ver, and then
  drives it with pb.set(progress, label) and pb.out().
-->
<style>
  @font-face { font-family: 'M PLUS Rounded 1c'; font-weight: 900; src: url(fonts/m-plus-rounded-1c-latin-900-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 800; src: url(fonts/nunito-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 800; src: url(fonts/nunito-cyrillic-800-normal.woff2) format('woff2'); unicode-range: U+0400-04FF; }
  :root {
    --title: 'M PLUS Rounded 1c', 'Nunito', 'Segoe UI', 'Microsoft YaHei', 'Malgun Gothic', 'Yu Gothic UI', system-ui, sans-serif;
    --text: 'Nunito', 'Segoe UI', 'Microsoft YaHei', 'Malgun Gothic', 'Yu Gothic UI', system-ui, sans-serif;
    --ink: #2a2440; --navy: #2a2a7a; --yellow: #ffd23a;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1630; user-select: none; cursor: default; }
  body { font-family: var(--text); font-weight: 800; color: #fff; opacity: 0; transition: opacity .35s ease; }
  body.in { opacity: 1; }
  body.out { opacity: 0; transition-duration: .45s; }

  /* The illustration (pixel art painted at 1672×941, not on a clean grid: scaled smooth), with a slow push-in. */
  .art { position: absolute; inset: -2%; background: center / cover no-repeat; animation: push 26s ease-out both; }
  @keyframes push { from { transform: scale(1); } to { transform: scale(1.07); } }
  .shade { position: absolute; inset: 0; background:
    linear-gradient(180deg, rgba(26,22,48,.35) 0%, rgba(26,22,48,0) 26%, rgba(26,22,48,0) 58%, rgba(20,16,40,.82) 86%, rgba(16,12,34,.94) 100%); }

  /* The game's wordmark (src/ui/styles.css, .logo-word): white «Poké», yellow «Bonk», navy stroke, a Poké Ball. */
  .logo { position: absolute; left: 50%; top: 9vh; transform: translateX(-50%); font-family: var(--title); font-weight: 900; animation: float 3.4s ease-in-out infinite; }
  .word { position: relative; font-size: clamp(56px, 8.5vw, 132px); line-height: .92; letter-spacing: 1px; white-space: nowrap; transform: rotate(-3deg);
    -webkit-text-stroke: 4px var(--navy); paint-order: stroke fill; text-shadow: 0 7px 0 var(--navy), 0 14px 30px rgba(20,10,60,.45); }
  .word span { color: var(--yellow); position: relative; }
  .ball { position: absolute; right: -.42em; top: -.08em; width: .6em; height: .6em; image-rendering: pixelated; filter: drop-shadow(0 4px 0 var(--navy)); animation: wobble 2.6s ease-in-out infinite; }
  @keyframes float { 50% { translate: 0 -8px; } }
  @keyframes wobble { 0%, 64%, 100% { transform: rotate(0); } 70% { transform: rotate(-16deg); } 78% { transform: rotate(14deg); } 86% { transform: rotate(-6deg); } }

  /* Bottom: tip card, status line and the bar. */
  .foot { position: absolute; left: 50%; bottom: 6vh; transform: translateX(-50%); width: min(760px, calc(100% - 64px)); display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .tip { display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; min-height: 58px; padding: 10px 20px 10px 10px; border-radius: 999px;
    background: rgba(255,255,255,.95); color: var(--ink); box-shadow: 0 5px 0 rgba(0,0,0,.25); transition: opacity .35s, transform .35s; }
  .tip.swap { opacity: 0; transform: translateY(6px); }
  .tip b { flex: none; padding: 6px 14px; border-radius: 999px; background: linear-gradient(180deg, #ff8a4a, #e84a2a); color: #fff; font-family: var(--title); font-size: 14px; letter-spacing: .6px; text-transform: uppercase; box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); }
  .tip p { margin: 0; font-size: 17px; line-height: 1.3; }
  .status { display: flex; justify-content: space-between; width: 100%; font-size: 15px; text-shadow: 0 2px 3px rgba(0,0,0,.6); }
  .status small { opacity: .7; font-size: 13px; }
  .bar { position: relative; width: 100%; height: 18px; border-radius: 999px; background: rgba(255,255,255,.22); box-shadow: inset 0 2px 3px rgba(0,0,0,.35), 0 0 0 3px rgba(255,255,255,.9); overflow: hidden; }
  .bar i { position: absolute; inset: 0; transform-origin: left; transform: scaleX(0); border-radius: 999px; background: linear-gradient(180deg, #7af0a0, #2ac860); transition: transform .4s ease-out; }
  .bar i::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, rgba(255,255,255,.22) 0 10px, rgba(255,255,255,0) 10px 20px); background-size: 28px 28px; animation: stripes .8s linear infinite; }
  @keyframes stripes { to { background-position: 28px 0; } }
  @media (max-height: 640px) { .logo { top: 5vh; } .tip p { font-size: 15px; } }
  @media (prefers-reduced-motion: reduce) { .art, .logo, .ball, .bar i::after { animation: none; } }
</style>
</head>
<body>
<div class="art" id="art"></div>
<div class="shade"></div>
<div class="logo"><div class="word">Poké<span>Bonk<img class="ball" src="splash/poke-ball.png" alt="" /></span></div></div>
<div class="foot">
  <div class="tip" id="tip"><b id="tipLabel"></b><p id="tipText"></p></div>
  <div class="status"><span id="label"></span><small id="ver"></small></div>
  <div class="bar"><i id="fill"></i></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);
  document.documentElement.lang = q.get('lang') || 'en';
  $('ver').textContent = q.get('ver') ? 'v' + q.get('ver') : '';
  $('label').textContent = q.get('label') || '';
  $('tipLabel').textContent = q.get('tip') || '';
  const art = new Image();
  art.onload = art.onerror = () => { if (art.naturalWidth) $('art').style.backgroundImage = `url("${art.src}")`; document.body.classList.add('in'); };
  art.src = 'splash/' + (q.get('img') || 'forest') + '.webp';
  // Tips: a random start, then the next one every 7 s.
  let tips = []; try { tips = JSON.parse(q.get('tips') || '[]'); } catch {}
  let n = Math.floor(Math.random() * Math.max(1, tips.length));
  const tipEl = $('tip');
  const showTip = () => { $('tipText').textContent = tips[n % tips.length] || ''; tipEl.hidden = !tips.length; };
  showTip();
  setInterval(() => { tipEl.classList.add('swap'); setTimeout(() => { n++; showTip(); tipEl.classList.remove('swap'); }, 350); }, 7000);
  // Driven by the client. The bar never goes back.
  let shown = 0;
  window.pb = {
    set(p, label) {
      if (typeof p === 'number' && p > shown) { shown = Math.min(1, p); $('fill').style.transform = `scaleX(${shown.toFixed(3)})`; }
      if (label) $('label').textContent = label;
    },
    out() { document.body.classList.add('out'); },
  };
</script>
</body>
</html>
