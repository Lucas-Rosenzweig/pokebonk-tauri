<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' tauri: http://tauri.localhost; connect-src ipc: http://ipc.localhost" />
<title>PokéBonk</title>
<style>
  /* Same look as the game's cards (src/ui/theme.css): white card, pill button, striped header. */
  html, body { margin: 0; height: 100%; background: #1a1630; font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif; font-weight: 700; color: #2a2440; user-select: none; }
  body { display: grid; place-items: center; }
  .card { width: min(520px, calc(100% - 32px)); background: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 12px 0 rgba(0,0,0,.25); text-align: center; }
  .head { height: 18px; background: repeating-linear-gradient(-45deg, #ffcc33 0 14px, #f2a516 14px 28px); }
  .body { padding: 26px 28px 30px; }
  img { width: 96px; height: 96px; }
  h1 { font-size: 22px; margin: 10px 0 8px; }
  p { margin: 0 0 22px; color: #5a5478; line-height: 1.45; font-size: 15px; }
  button { font: inherit; font-size: 17px; color: #fff; background: #3a8cff; border: 0; border-radius: 999px; padding: 12px 34px; cursor: pointer; box-shadow: 0 4px 0 #2563d8; }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 #2563d8; }
</style>
</head>
<body>
<div class="card"><div class="head"></div><div class="body">
  <img src="icon.png" alt="" />
  <h1 id="title"></h1>
  <p id="text"></p>
  <button id="retry"></button>
</div></div>
<script>
  const q = new URLSearchParams(location.search);
  document.documentElement.lang = q.get('lang') || 'en';
  document.getElementById('title').textContent = q.get('title') || '';
  document.getElementById('text').textContent = q.get('body') || '';
  const b = document.getElementById('retry');
  b.textContent = q.get('retry') || 'Retry';
  const go = () => { b.disabled = true; window.pokebonkDesktop?.retry(); };
  b.onclick = go;
  addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') go(); });
  // Try again by itself every 20 s: a deploy or a short outage comes back on its own.
  setTimeout(go, 20000);
</script>
</body>
</html>
