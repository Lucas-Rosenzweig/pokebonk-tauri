[package]
name = "pokebonk-tauri"
version = "0.1.0"
description = "Client de bureau PokéBonk en Tauri (non officiel)"
edition = "2021"
rust-version = "1.82"

[lib]
name = "pokebonk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
keepawake = "0.6"
ureq = "3"
sys-locale = "0.3"
rand = "0.9"
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
